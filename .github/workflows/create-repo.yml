name: Create repo from Port

on:
  workflow_dispatch:
    inputs:
      repo_name:
        description: "Name of the new repository"
        required: true
      run_id:
        description: "Port runId (passed from Port)"
        required: true

jobs:
  create-repo:
    runs-on: ubuntu-latest

    steps:
      # 1. Create repository
      - name: Create repository
        id: create_repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_NAME: ${{ github.event.inputs.repo_name }}
        run: |
          set -e
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/resp.json \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/repos \
            -d "{\"name\":\"$REPO_NAME\",\"private\":true}")
          if [ "$RESPONSE" != "201" ]; then
            echo "created=false" >> $GITHUB_OUTPUT
            echo "error=$(cat /tmp/resp.json | tr '\n' ' ')" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "created=true" >> $GITHUB_OUTPUT

      # 2. Report success to Port
      - name: Report success to Port
        if: ${{ success() && steps.create_repo.outputs.created == 'true' }}
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ github.event.inputs.run_id }}
          status: "SUCCESS"
          logMessage: |
            Repository ${{ github.event.inputs.repo_name }} created successfully.

      # 3. Report failure to Port
      - name: Report failure to Port
        if: ${{ failure() }}
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET }}
          baseUrl: https://api.getport.io
          operation: PATCH_RUN
          runId: ${{ github.event.inputs.run_id }}
          status: "FAILURE"
          logMessage: |
            Failed to create repository ${{ github.event.inputs.repo_name }}.
            Error: ${{ steps.create_repo.outputs.error }}
